name: helium_browser
description: A lightweight, privacy-first mobile browser inspired by Helium.
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # Core WebView — the browser engine wrapper
  flutter_inappwebview: ^6.0.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # Local database (fast, pure Dart)
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3

  # UI utilities
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  url_launcher: ^6.3.0

  # Utilities
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  uuid: ^4.4.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  isar_generator: ^3.1.0+1

  # Testing
  mocktail: ^1.0.4
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/filters/
    - assets/scriptlets/
